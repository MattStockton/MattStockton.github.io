# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.


title: Matt Stockton

author:
  name: Matt Stockton
  email: mattstockton@gmail.com
  bio: "Software engineer writing about applied AI, machine learning, and software development."
  avatar: "/docs/assets/images/matt.jpeg"
  twitter: mstockton
  x: "https://x.com/mstockton"
  linkedin: "https://www.linkedin.com/in/mattstockton/"

description: >- # this means to ignore newlines until "baseurl:"
  Writing about software development, applied AI, and machine learning.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://mattstockton.com" # the base hostname & protocol for your site

contact_email: "hello@pragmanexus.com"
company:
  name: "PragmaNexus"
  url: "https://pragmanexus.com"
  case_studies: "https://pragmanexus.com/case-studies"

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Better related posts
lsi: false

# Exclude from processing.
exclude:
  - AGENTS.md
  - CLAUDE.md
  - .agents/
  - .claude/
  - .codex/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/


# Permalink structure for posts - explicitly exclude categories
permalink: /:year/:month/:day/:title.html

# Force Jekyll to ignore categories in permalinks

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      permalink: /:year/:month/:day/:title.html
  - scope:
      path: ""
    values:
      image: "/docs/assets/images/site/social-card.png"

analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-HFEW5N1H7X"
    anonymize_ip: false # default

# SEO settings
twitter:
  username: "mstockton"
  card: summary_large_image

social:
  type: Person
  name: Matt Stockton
  links:
    - "https://x.com/mstockton"
    - "https://www.linkedin.com/in/mattstockton/"

head_scripts:
  - https://cdn-cookieyes.com/client_data/cc3cc7c737387cca67e28af5/script.js

collections:
  digests:
    output: true
    permalink: /writing/digest/:name/

feed:
  collections:
    digests:
      path: /writing/digest/feed.xml
