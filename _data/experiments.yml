- title: "The Listening Index"
  slug: "listening-index"
  url: "/standalone/listening-index.html"
  preview: "/standalone/listening-index-preview.png"
  preview_alt: "The Listening Index over a field of 151 tally marks, one per episode, above five figures: 1,214 takeaways, 151 episodes, 22 shows, 144 speakers, 142 hours of audio."
  date: "Aug 2026"
  datetime: "2026-08-21"
  kind: "Searchable index"
  featured: true
  cta: "Browse the index"
  short: "1,214 takeaways from 151 podcast episodes, searchable by topic, show, and speaker."
  summary: "I built this because I kept losing track of which podcast episode an idea came from. After I finish an episode, a script finds or makes a transcript and a model writes down the ideas I may want to find later. You can search all 1,214 takeaways by topic, show, or speaker. Every one includes an excerpt and a link to the original episode."
  data: "151 episodes across 22 shows, totaling 142 hours of audio. The script looks for a publisher transcript first, then video captions, then runs Whisper locally. Claude wrote and scored 1,707 takeaways. Code sorts them, checks the quotes, and publishes the 1,214 that scored 3 to 5."
  built_with: "Claude Code, Python, Whisper, a local Apple Podcasts library"

