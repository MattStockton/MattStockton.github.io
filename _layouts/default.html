<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% for script in site.head_scripts %}<script src="{{ script }}"></script>
  {% endfor %}
  {% seo %}
  {% feed_meta %}
  {% if page.layout == 'digest' or page.url contains '/writing/digest/' %}<link rel="alternate" type="application/atom+xml" title="Matt Stockton | Digest" href="{{ '/writing/digest/feed.xml' | absolute_url }}">{% endif %}
  <link rel="icon" href="/docs/assets/images/site/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/docs/assets/images/site/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/docs/assets/images/site/apple-touch-icon.png" sizes="180x180">
  <meta name="theme-color" content="#F6F4EF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/docs/assets/css/site.css' | relative_url }}">
  {% include analytics.html %}
</head>
<body class="{{ page.body_class }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include masthead.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
