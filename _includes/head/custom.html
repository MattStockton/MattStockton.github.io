<style>
/* =================================================================
   PERSONAL SITE DESIGN SYSTEM
   ================================================================= */

/* CSS Custom Properties */
:root {
  --site-width: 1120px;
  --reading-width: 720px;
  --page-gutter: 24px;
  --page-top: 48px;
  --type-body: 1.125rem;
  --type-title: clamp(2.125rem, 4vw, 3.5rem);
  --type-section: 2rem;

  /* Primary - Deep Teal */
  --color-primary: #0A4D68;
  --color-primary-dark: #062E3F;
  --color-primary-light: #0D5F7F;

  /* Secondary - Warm Gold */
  --color-secondary: #F5A623;
  --color-secondary-light: #FFB84D;

  /* Backgrounds */
  --color-bg: #FAFBFC;
  --color-bg-warm: #FFFBF5;
  --color-surface: #FFFFFF;
  --color-surface-elevated: #F8FAFC;

  /* Text */
  --color-text: #1E293B;
  --color-text-muted: #64748B;
  --color-text-light: #94A3B8;

  /* Borders & Effects */
  --color-border: #E2E8F0;
  --color-border-hover: #CBD5E1;

  /* Gradients */
  --gradient-hero: linear-gradient(135deg, #F0F8FA 0%, #FFFBF2 100%);
  --gradient-accent: linear-gradient(135deg, #0A4D68 0%, #0D5F7F 100%);
  --gradient-card: linear-gradient(135deg, rgba(10, 77, 104, 0.025) 0%, rgba(245, 166, 35, 0.025) 100%);
  --gradient-text: linear-gradient(135deg, #062E3F 0%, #0D5F7F 100%);

  /* Typography */
  --font-display: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-serif: 'Instrument Serif', Georgia, serif;

  /* Spacing */
  --space-xs: 0.25rem;
  --space-sm: 0.5rem;
  --space-md: 1rem;
  --space-lg: 1.5rem;
  --space-xl: 2rem;
  --space-2xl: 3rem;
  --space-3xl: 4rem;

  /* Border Radius */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 24px;

  /* Shadows */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.06);
  --shadow-hover: 0 12px 32px rgba(10, 77, 104, 0.12);

  /* Transitions */
  --transition-fast: 0.15s ease;
  --transition-base: 0.25s ease;
  --transition-slow: 0.4s ease;
}

/* =================================================================
   BASE STYLES
   ================================================================= */

html { font-size: 100%; }

body {
  font-size: var(--type-body);
  font-family: var(--font-body);
  color: var(--color-text);
  background-color: var(--color-bg);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h1 { text-wrap: balance; }

.page__content :is(h1, h2, h3, h4, h5, h6)[id] { scroll-margin-top: 7rem; }
.header-link { display: inline-block; }

.header-link .sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.header-link .fas { display: none; }
.header-link::after { content: "#"; font-family: var(--font-body); }
.header-link:focus-visible { opacity: 1; }


h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--color-text);
  letter-spacing: -0.02em;
  line-height: 1.25;
}

/* =================================================================
   HEADER / MASTHEAD
   ================================================================= */

.masthead {
  background-color: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--color-border);
  padding: 0.35rem 0;
  position: sticky;
  top: 0;
  z-index: 100;
  transition: box-shadow var(--transition-base);
}

.masthead:hover {
  box-shadow: var(--shadow-md);
}

.masthead__inner-wrap {
  padding: 0.5rem var(--page-gutter);
  max-width: var(--site-width);
  margin: 0 auto;
}

/* Site Title */
.site-title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.6rem;
  background: var(--gradient-text);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  padding: 0.25rem 0;
  transition: opacity var(--transition-base);
}

.site-title:hover {
  opacity: 0.85;
}

/* Remove default underlines */
.site-title:before,
.site-title:after,
.greedy-nav a:before {
  display: none !important;
}

/* Navigation */
.greedy-nav {
  background: transparent;
  height: auto;
}

.greedy-nav .visible-links {
  display: flex;
  align-items: center;
  height: auto;
  gap: 0.25rem;
}

.greedy-nav a {
  font-family: var(--font-body);
  margin: 0;
  padding: 10px 14px;
  font-weight: 500;
  font-size: 16px;
  color: var(--color-text-muted);
  position: relative;
  transition: color var(--transition-fast);
  border-radius: var(--radius-sm);
}

.greedy-nav a:hover {
  color: var(--color-primary);
}

/* Nav link underline animation */
.greedy-nav .visible-links li a {
  position: relative;
}

.greedy-nav .visible-links li a:after {
  content: "";
  position: absolute;
  bottom: 0.35rem;
  left: 14px;
  right: 14px;
  height: 2px;
  background: var(--gradient-accent);
  transform: scaleX(0);
  transform-origin: right;
  transition: transform var(--transition-base);
  border-radius: 1px;
  display: block !important;
}

.greedy-nav .visible-links li a:hover:after {
  transform: scaleX(1);
  transform-origin: left;
}

/* Mobile nav toggle */
.greedy-nav__toggle {
  background-color: var(--color-surface-elevated);
  border-radius: var(--radius-sm);
  padding: 0.5rem;
  transition: background-color var(--transition-fast);
}

.greedy-nav__toggle:hover {
  background-color: var(--color-border);
}

/* =================================================================
   PAGE CONTENT
   ================================================================= */

.page__title {
  font-family: var(--font-display);
  color: var(--color-text) !important;
  font-weight: 800;
  letter-spacing: -0.025em;
  font-size: 2.5rem;
}

.page__lead {
  font-family: var(--font-body);
  color: var(--color-text-muted) !important;
  font-size: 1.25rem;
  line-height: 1.6;
}

/* Content headings */
.page__content h2 {
  color: var(--color-text);
  font-size: 1.75rem;
  margin-top: var(--space-2xl);
  margin-bottom: var(--space-md);
  padding-bottom: var(--space-sm);
  border-bottom: 2px solid var(--color-border);
}

.page__content h3 {
  color: var(--color-text);
  font-size: 1.35rem;
  margin-top: var(--space-xl);
  margin-bottom: var(--space-sm);
}

.page__content h4,
.page__content h5,
.page__content h6 {
  color: var(--color-text);
  font-size: 1.1rem;
  margin-top: var(--space-lg);
  margin-bottom: var(--space-sm);
}

/* Links */
.page__content a:not(.btn) {
  color: var(--color-primary);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color var(--transition-fast), color var(--transition-fast);
}

.page__content a:not(.btn):hover {
  color: var(--color-primary-dark);
  border-bottom-color: var(--color-primary);
}

/* Blockquotes */
.page__content blockquote {
  background: var(--color-bg-warm);
  border-left: 4px solid var(--color-secondary);
  border-radius: 0 var(--radius-md) var(--radius-md) 0;
  padding: var(--space-lg) var(--space-xl);
  margin: var(--space-xl) 0;
  font-style: normal;
  color: var(--color-text);
}

.page__content blockquote p:last-child {
  margin-bottom: 0;
}

/* Code blocks */
.page__content pre {
  background: var(--color-surface-elevated);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius-md);
  padding: var(--space-lg);
  overflow-x: auto;
  font-size: 0.9rem;
}

.page__content code {
  font-size: 0.9em;
  background: var(--color-surface-elevated);
  padding: 0.15em 0.4em;
  border-radius: var(--radius-sm);
  color: var(--color-primary-dark);
}

.page__content pre code {
  background: transparent;
  padding: 0;
  color: inherit;
}

/* Lists */
.page__content ul,
.page__content ol {
  padding-left: 1.5rem;
}

.page__content li {
  margin-bottom: 0.5rem;
}

/* =================================================================
   BUTTONS
   ================================================================= */

.btn {
  font-family: var(--font-display);
  font-weight: 600;
  padding: 0.75rem 1.5rem;
  border-radius: var(--radius-md);
  transition: all var(--transition-base);
  border: none;
  cursor: pointer;
}

.btn--primary {
  background: var(--gradient-accent);
  color: white;
  box-shadow: 0 2px 8px rgba(10, 77, 104, 0.25);
}

.btn--primary:hover {
  box-shadow: 0 4px 16px rgba(10, 77, 104, 0.35);
  transform: translateY(-1px);
}

.btn--inverse {
  background: var(--color-surface);
  color: var(--color-primary);
  border: 2px solid var(--color-border);
}

.btn--inverse:hover {
  border-color: var(--color-primary);
  background: rgba(10, 77, 104, 0.05);
}

/* =================================================================
   ARCHIVE / POST LISTINGS
   ================================================================= */

.archive__item-title a {
  font-family: var(--font-display);
  color: var(--color-text);
  transition: color var(--transition-fast);
}

.archive__item-title a:hover {
  color: var(--color-primary);
}

.archive__item-excerpt {
  color: var(--color-text-muted);
  line-height: 1.6;
}

/* =================================================================
   FOOTER
   ================================================================= */

.page__footer {
  background-color: var(--color-surface);
  color: var(--color-text);
  border-top: 1px solid var(--color-border);
  margin-top: var(--space-3xl);
}

.page__footer a {
  color: var(--color-primary);
  transition: color var(--transition-fast);
}

.page__footer a:hover {
  color: var(--color-primary-dark);
}

.page__footer-copyright {
  color: var(--color-text-muted);
  font-size: 0.9rem;
}

.page__footer-follow .social-icons .fa,
.page__footer-follow .social-icons .fab,
.page__footer-follow .social-icons .fas {
  color: var(--color-primary);
}

/* =================================================================
   ANIMATIONS
   ================================================================= */

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.animate-in {
  animation: fadeInUp 0.6s ease-out forwards;
  opacity: 0;
}

.delay-1 { animation-delay: 0.1s; }
.delay-2 { animation-delay: 0.2s; }
.delay-3 { animation-delay: 0.3s; }
.delay-4 { animation-delay: 0.4s; }
.delay-5 { animation-delay: 0.5s; }

/* =================================================================
   UTILITY CLASSES
   ================================================================= */

.text-gradient {
  background: var(--gradient-text);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  transition: all var(--transition-base);
}

.card:hover {
  border-color: var(--color-primary);
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
}

.accent-border {
  position: relative;
  padding-left: var(--space-lg);
}

.accent-border::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--gradient-accent);
  border-radius: 2px;
}

/* =================================================================
   LAYOUT OVERRIDES
   ================================================================= */

/* Global container width */
#main {
  width: 100%;
  max-width: none;
  margin: 0;
  padding: 0;
  float: none;
}

.splash > .page__content {
  width: 100%;
  max-width: none;
  margin: 0;
  padding: 0;
}

.page__content {
  font-size: var(--type-body);
  line-height: 1.6;
}

.page__content :is(.home-eyebrow, .digest-eyebrow, .work-kicker) {
  font-size: 0.8125rem;
  line-height: 1.5;
  margin: 0 0 1rem;
}

.page__content :is(.post-excerpt, .experiment-summary, .job-description) {
  font-size: 1rem;
}

.page__content .home-intro {
  font-size: 1.1875rem;
  line-height: 1.6;
  margin: 0;
}

/* Hide default sidebar */
.sidebar__right {
  display: none !important;
}

.layout--collection .page__content {
  float: none !important;
  width: 100% !important;
}

/* =================================================================
   RESPONSIVE ADJUSTMENTS
   ================================================================= */

@media (max-width: 1024px) {
  .masthead__inner-wrap {
    padding: 0.5rem var(--page-gutter);
  }

  .site-title {
    font-size: 1.4rem;
  }

  .greedy-nav a {
    padding: 9px 12px;
    font-size: 15px;
  }

  .page__title {
    font-size: 2rem;
  }
}

@media (max-width: 768px) {
  :root {
    --page-gutter: 20px;
    --page-top: 32px;
    --type-body: 1.0625rem;
    --type-section: 1.75rem;
    --space-xl: 1.5rem;
    --space-2xl: 2rem;
    --space-3xl: 3rem;
  }

  .page__content .home-intro { font-size: var(--type-body); }

  .masthead__inner-wrap {
    padding: 0.5rem var(--page-gutter);
  }

  .site-title {
    font-size: 1.25rem;
  }

  .greedy-nav a {
    padding: 8px 10px;
    font-size: 14px;
  }

  .page__title {
    font-size: 1.75rem;
  }

  .page__content h2 {
    font-size: 1.5rem;
  }

  .page__content h3 {
    font-size: 1.2rem;
  }
}

/* =================================================================
   HERO / SPLASH PAGE BACKGROUNDS
   ================================================================= */

.hero-gradient {
  background: var(--gradient-hero);
  position: relative;
}

.hero-gradient::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle at 25% 25%, rgba(10, 77, 104, 0.05) 0%, transparent 50%),
                    radial-gradient(circle at 75% 75%, rgba(245, 166, 35, 0.05) 0%, transparent 50%);
  pointer-events: none;
}

/* Subtle dot pattern overlay */
.pattern-dots {
  background-image: radial-gradient(circle, var(--color-border) 1px, transparent 1px);
  background-size: 24px 24px;
}
</style>
